name: Android Build & Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Android-Ping-Tool.apk
      - uses: actions/upload-artifact@v4
        with: { name: Android-Ping-Tool, path: Android-Ping-Tool.apk }
      - name: Publish GitHub Release
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Android-Ping-Tool.apk --title "Android Ping Tool $TAG" --generate-notes
