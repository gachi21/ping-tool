name: Android Build & Release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Locate APK
        shell: bash
        run: |
          APK=$(find app/build -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" Android-Ping-Tool.apk
          ls -lh Android-Ping-Tool.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Ping-Tool
          path: Android-Ping-Tool.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Android-Ping-Tool.apk --title "Android Ping Tool $TAG" --generate-notes
